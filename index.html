<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>パスワード生成</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--sub:#6b7280;--accent:#4f6bed;--line:#e3e6ef}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--sub:#9aa1b2;--accent:#7b93ff;--line:#2d313c}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.6;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.25rem;margin:0 0 16px}
h2{font-size:.9rem;margin:16px 0 4px;color:var(--sub);font-weight:600}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
#pw{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:1.5rem;letter-spacing:.04em;word-break:break-all;text-align:center;
  padding:14px 8px;user-select:all;min-height:3.4rem}
.info{text-align:center;color:var(--sub);font-size:.8rem;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.actions button{flex:1}
.chip.active{border-color:var(--accent);color:var(--accent);font-weight:600}
label.check{display:flex;gap:8px;align-items:center;padding:6px 0}
input[type=checkbox]{width:18px;height:18px}
input[type=number]{font:inherit;width:5rem;padding:8px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--text)}
.note{color:var(--sub);font-size:.8rem}
#status{min-height:1.4em;text-align:center;color:var(--accent);font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>パスワード生成</h1>

  <div class="card">
    <code id="pw"></code>
    <div class="info" id="info"></div>
    <div class="row actions">
      <button class="primary" id="gen">もう一度作る</button>
      <button id="copy">コピー</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2>文字数</h2>
    <div class="row">
      <button class="chip" data-len="8">8</button>
      <button class="chip" data-len="12">12</button>
      <button class="chip" data-len="16">16</button>
      <button class="chip" data-len="24">24</button>
      <input type="number" id="len" min="4" max="40" value="12" inputmode="numeric" aria-label="文字数">
    </div>

    <h2>使う文字</h2>
    <label class="check"><input type="checkbox" id="upper" checked> 英字（大文字）</label>
    <label class="check"><input type="checkbox" id="lower" checked> 英字（小文字）</label>
    <label class="check"><input type="checkbox" id="digit" checked> 数字</label>
    <label class="check"><input type="checkbox" id="symbol"> 記号（<code>-_.!#$%&amp;*+/~</code>）</label>

    <h2>その他</h2>
    <label class="check"><input type="checkbox" id="each" checked> 選んだ文字種を必ず含める</label>
    <label class="check"><input type="checkbox" id="noAmbig"> 似ている文字を省く（I l 1 O o 0）</label>
  </div>

  <p class="note">パスワードはこのブラウザの中だけで作られ、どこにも送信・保存されません。</p>
</main>

<script>
(() => {
  const SETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    digit: '0123456789',
    symbol: '-_.!#$%&*+/~'
  };
  const TYPES = ['upper', 'lower', 'digit', 'symbol'];
  const AMBIG = /[Il1Oo0]/g;
  const $ = id => document.getElementById(id);

  // 偏りのない乱数（暗号用の乱数 + 棄却サンプリング）
  function randInt(max) {
    const limit = Math.floor(4294967296 / max) * max;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }
  const pick = str => str[randInt(str.length)];
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getLen() {
    const n = parseInt($('len').value, 10);
    return Math.min(40, Math.max(4, Number.isFinite(n) ? n : 12));
  }
  function activeSets() {
    const noAmbig = $('noAmbig').checked;
    return TYPES.filter(k => $(k).checked)
                .map(k => noAmbig ? SETS[k].replace(AMBIG, '') : SETS[k]);
  }
  function syncChips() {
    document.querySelectorAll('.chip').forEach(b =>
      b.classList.toggle('active', Number(b.dataset.len) === getLen()));
  }

  function generate() {
    const len = getLen();
    const sets = activeSets();
    const pool = sets.join('');
    const chars = [];
    if ($('each').checked) sets.forEach(s => chars.push(pick(s)));
    while (chars.length < len) chars.push(pick(pool));
    shuffle(chars);
    $('pw').textContent = chars.join('');
    const bits = Math.round(len * Math.log2(pool.length));
    $('info').textContent = `${len}文字 ・ 使える文字 ${pool.length}種 ・ 強度の目安 約${bits}ビット`;
    $('status').textContent = '';
    syncChips();
  }

  async function copy() {
    const text = $('pw').textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents($('pw'));
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
    }
    $('status').textContent = 'コピーしました';
  }

  $('gen').addEventListener('click', generate);
  $('copy').addEventListener('click', copy);
  document.querySelectorAll('.chip').forEach(b =>
    b.addEventListener('click', () => { $('len').value = b.dataset.len; generate(); }));
  $('len').addEventListener('input', generate);
  $('len').addEventListener('change', () => { $('len').value = getLen(); generate(); });
  TYPES.forEach(k => $(k).addEventListener('change', e => {
    if (!TYPES.some(t => $(t).checked)) e.target.checked = true; // 全部オフは防ぐ
    generate();
  }));
  ['each', 'noAmbig'].forEach(k => $(k).addEventListener('change', generate));

  generate(); // 開いた瞬間に1個出す
})();
</script>
</body>
</html>
